if(c('.sb .lg'))return go(rl.sc[0][0]);
const p=c('.pn>div');if(p){const i=all('.pn>div').indexOf(p);if(rl.pill[i][1]==='More'){st.sheet=1;return view()}return go(rl.pill[i][2][0])}
const th=c('.s3 span');if(th)return setTh(['light','dark','system'][all('.s3 span').indexOf(th)]);
if(c('.bl'))return go(NT[st.r]);if(c('.usr')){st.pop=!st.pop;return view()}if(c('.lgm')){st.sheet=1;return view()}if(c('.sr'))return toast('Search is not part of this prototype','in');if(c('.bk'))return back();
const tb=c('.tabs span');if(tb){const g=TB[tb.textContent.trim()];return g?go(g):toast('Course settings (demo)','in')}
const sg=c('.seg span');if(sg){const i=all('.seg span').filter(z=>z.parentElement===sg.parentElement).indexOf(sg);if(st.s==='nsub'){st.sub=i;return view()}const lab=sg.textContent.trim();if(['Light','Dark','System'].includes(lab))return setTh(lab.toLowerCase());[...sg.parentElement.children].forEach(z=>z.classList.toggle('on',z===sg));return}
if(c('.fab')){const s=st.s;if(s==='users'){st.sd=!st.sd;return view()}if(s==='crs'||s==='lcrs')return go('lnew');if(s==='lcw')return go('lles');if(s==='enr')return toast('Choose a course and learners, then press Enrol','in');return toast('Assignment draft created')}
if(c('.tg')){c('.tg').classList.toggle('on');return toast('Setting saved')}
const pp=c('.pp');if(pp){if(pp.textContent==='▶'){pp.textContent='⏸';pp._t=setInterval(()=>{const a=pp.closest('.ap');if(!a)return clearInterval(pp._t);const i=a.querySelector('.trk i');let w=parseFloat(i.style.width)||35;i.style.width=(w>=100?0:w+2)+'%'},500)}else{clearInterval(pp._t);pp.textContent='▶'}return}
const mc=c('.mic');if(mc){const v=document.querySelector('.rec .v');if(mc._t){clearInterval(mc._t);mc._t=0;return toast('Recording stopped','in')}let n=0;toast('Recording started','in');mc._t=setInterval(()=>{if(!v.isConnected)return clearInterval(mc._t);n++;v.textContent='0'+Math.floor(n/60)+':'+String(n%60).padStart(2,'0')},1000);return}
if(c('.upl'))return toast('File selected: genesis-notes.pdf (1.2 MB)','in');
const b=c('.b');if(b)return act(b.textContent.trim(),b);
const fc=c('.fl .ch');if(fc)return fc.classList.toggle('sel');
const cp=c('.ch');if(cp){const l=cp.textContent.trim();if(l==='Review')return go('apr');if(l==='Resend')return toast('Invitation resent')}
const cc=c('.cc');if(cc&&CC[st.s])return go(CC[st.s]);
const li=c('.li');if(li){const d=li.querySelector('.dot');if(d)d.remove();let g=LI[st.s];if(st.s==='nasg')g=/Graded|88%/.test(li.textContent)?'ngrd':'nsub';if(g)return go(g)}
const tr=c('tbody tr')||c('table tr');if(tr&&!tr.closest('thead')&&RT[st.s]){if(RT[st.s]==='det'){const bb=tr.querySelector('b');st.det={n:bb?bb.textContent:tr.cells[0].textContent.trim(),s:'Demo record'}}return go(RT[st.s])}});
st.d=innerWidth<820?'ph':'desk';st.t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
addEventListener('resize',()=>{const d=innerWidth<820?'ph':'desk';if(d!==st.d){st.d=d;view()}});view();
</script></body></html>
