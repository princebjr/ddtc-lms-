<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="DDTC LMS: learning management system for Dynamic Discipleship Training Centre." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>DDTC LMS</title>
    <script>
      // Applies the saved theme before the first paint so there is no flash (DESIGN.md 6).
      // Kept in step with src/lib/theme.js (THEME_STORAGE_KEY, THEME_COLORS).
      (function () {
        var choice = 'system';
        try {
          var saved = window.localStorage.getItem('ddtc-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') choice = saved;
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.setAttribute('data-theme-choice', choice);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0a1428' : '#f8fafc');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DDTC LMS needs JavaScript. Turn it on in your browser settings, then reload this page.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
