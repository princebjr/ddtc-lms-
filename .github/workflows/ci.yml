name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint, types, unit tests, secret scan, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run scan:secrets
      - run: npm run audit:deps
      - run: npm run build

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan repository history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  database:
    name: Database tests (pgTAP on local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Supabase's local ports (54320 to 54329, supabase/config.toml) lie inside Linux's range for
      # outgoing connections, so a busy runner could already hold one when Supabase starts ("address
      # already in use": three jobs on 2026-11-09, none of their tests run). Reserve them first.
      - name: Keep Supabase's local ports for Supabase
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54330
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database, auth, storage only)
        run: npm run db:start
      - run: npm run test:db
      - run: npm run test:functions
      - name: Generated database types match the migrations (D23)
        run: npm run db:types && git diff --exit-code src/lib/database.types.d.ts
      - if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: End-to-end (Playwright, all device projects, light and dark, shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 8 shards (owner request 2026-11-06: CI was too slow): about 8 minutes of tests each instead of 16.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # As in the database job: Supabase's local ports stay free for Supabase.
      - name: Keep Supabase's local ports for Supabase
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54330
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browsers are cached between runs (keyed on the lockfile, so a Playwright upgrade fetches
      # new ones). The system libraries still come from the runner's Ubuntu mirror, which on
      # 2026-11-10 took more than 10 minutes three times in a row on one shard (the browsers took
      # seconds): allow 20 minutes (the job allows 40).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers and their system libraries
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start local Supabase (database, auth, Mailpit) for the authentication tests
        run: npm run db:start
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
      - if: always()
        run: npx supabase stop --no-backup

  lighthouse:
    name: Lighthouse CI (mobile preset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

  # Single required status check for branch protection.
  ci-gate:
    name: CI gate
    if: always()
    needs: [static, gitleaks, database, e2e, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs must succeed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
